  <body>
    <section class="route-portal taoyuan-routes">
      <nav class="home-topbar" aria-label="桃園市安置類型選擇">
        <a class="brand" href="../" aria-label="回到縣市選擇首頁">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>菜菜老師｜特教資訊整理</span>
        </a>
        <label class="city-switcher">
          <span>切換縣市</span>
          <select class="city-switcher-select" aria-label="切換縣市">
            <option value="../taipei/">臺北市</option>
            <option value="../new-taipei/">新北市</option>
            <option value="../taoyuan/" selected>桃園市</option>
          </select>
        </label>
      </nav>

      <main class="route-stage">
        <div class="route-portal-heading">
          <p class="eyebrow">桃園市 115 學年度</p>
          <h1>請先選擇安置類型</h1>
        </div>

        <div class="route-card-grid three" aria-label="選擇桃園市安置類型">
          <a class="route-card high-school" href="high-school/">
            <span class="route-number">01</span>
            <div>
              <strong>高級中等學校</strong>
              <small>高級中等學校簡章</small>
            </div>
            <span class="route-arrow" aria-hidden="true">→</span>
          </a>
          <a class="route-card service" href="service/">
            <span class="route-number">02</span>
            <div>
              <strong>集中式特教班</strong>
              <small>高級中等學校集中式特教班簡章</small>
            </div>
            <span class="route-arrow" aria-hidden="true">→</span>
          </a>
          <a class="route-card special-school" href="special-school/">
            <span class="route-number">03</span>
            <div>
              <strong>特殊教育學校</strong>
              <small>特殊教育學校簡章</small>
            </div>
            <span class="route-arrow" aria-hidden="true">→</span>
          </a>
        </div>

        <p class="route-alert"><strong>請注意：</strong>三類簡章只能選擇一種報名，不得重複。</p>
      </main>
    </section>

    <footer class="site-disclaimer portal-footer">
      <div class="site-disclaimer-inner">
        <p class="disclaimer-summary">菜菜老師整理，非桃園市政府教育局官方網站。實際資格、日期及名額以桃園市最新公告為準。</p>
        <div class="footer-meta">
          <a href="https://tyshse.special.tyc.edu.tw/default.asp" target="_blank" rel="noreferrer">115 學年度官方安置網站</a>
          <span aria-hidden="true">·</span>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSedYbNxe2KVboSqAsJAMQVWfAW9JIbT7RuJecVzdOnh9gkT2w/viewform" target="_blank" rel="noreferrer">聯絡菜菜老師・提供建議</a>
          <span aria-hidden="true">·</span>
          <span>最後核對 2026/8/10</span>
        </div>
      </div>
    </footer>

    <script>
      document.querySelector(".city-switcher-select").addEventListener("change", (event) => {
        location.href = event.target.value;
      });
    </script>
