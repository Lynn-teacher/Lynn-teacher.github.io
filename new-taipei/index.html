  <body>
    <section class="route-portal new-taipei-routes">
      <nav class="home-topbar" aria-label="新北市安置類型選擇">
        <a class="brand" href="../" aria-label="回到縣市選擇首頁">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>菜菜老師｜特教資訊整理</span>
        </a>
        <label class="city-switcher">
          <span>切換縣市</span>
          <select class="city-switcher-select" aria-label="切換縣市">
            <option value="../taipei/">臺北市</option>
            <option value="../new-taipei/" selected>新北市</option>
            <option value="../taoyuan/">桃園市</option>
          </select>
        </label>
      </nav>

      <main class="route-stage">
        <div class="route-portal-heading">
          <p class="eyebrow">新北市 115 學年度</p>
          <h1>請先選擇安置類型</h1>
        </div>

        <div class="route-card-grid" aria-label="選擇新北市安置類型">
          <a class="route-card general" href="general/">
            <span class="route-number">01</span>
            <div>
              <strong>一般類科</strong>
              <small>高級中等學校一般類科</small>
              <p>查看資格、五月報名時程、學校名額與志願規定。</p>
            </div>
            <span class="route-arrow" aria-hidden="true">→</span>
          </a>
          <a class="route-card service" href="service/">
            <span class="route-number">02</span>
            <div>
              <strong>集中式特教班服務群科</strong>
              <small>高級中等學校服務群科</small>
              <p>查看三月報名、能力評估、志願選填與服務群科。</p>
            </div>
            <span class="route-arrow" aria-hidden="true">→</span>
          </a>
        </div>

        <p class="route-alert"><strong>請注意：</strong>兩類只能擇一報名，不得重複。</p>
      </main>
    </section>

    <footer class="site-disclaimer portal-footer">
      <div class="site-disclaimer-inner">

          <a href="https://sec.ntpc.edu.tw/p/405-1004-12330%2Cc969.php" target="_blank" rel="noreferrer">115 學年度官方簡章頁</a>
          <span aria-hidden="true">·</span>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSedYbNxe2KVboSqAsJAMQVWfAW9JIbT7RuJecVzdOnh9gkT2w/viewform" target="_blank" rel="noreferrer">聯絡菜菜老師・提供建議</a>
          <span aria-hidden="true">·</span>
          <span>最後核對 2026/8/2</span>
        </div>
      </div>
    </footer>

    <script>
      document.querySelector(".city-switcher-select").addEventListener("change", (event) => {
        location.href = event.target.value;
      });
      const legacyRoutes = new Set(["eligibility", "timeline", "schools", "faq"]);
      const legacyRoute = location.hash.slice(1);
      if (legacyRoutes.has(legacyRoute)) location.replace(`general/#${legacyRoute}`);
    </script>
