    <script>

      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-L23943G997");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css?v=20260810c" />
  </head>
  <body>
    <section class="route-portal taipei-routes">
      <nav class="home-topbar" aria-label="臺北市安置類型選擇">
        <a class="brand" href="../" aria-label="回到縣市選擇首頁">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>菜菜老師｜特教資訊整理</span>
        </a>
        <label class="city-switcher">
          <span>切換縣市</span>
          <select class="city-switcher-select" aria-label="切換縣市">
            <option value="../taipei/" selected>臺北市</option>
            <option value="../new-taipei/">新北市</option>
            <option value="../taoyuan/">桃園市</option>
          </select>
        </label>
      </nav>

      <main class="route-stage">
        <div class="route-portal-heading">
          <p class="eyebrow">臺北市 115 學年度</p>
          <h1>請先選擇安置類型</h1>
        </div>

        <div class="route-card-grid" aria-label="選擇臺北市安置類型">
          <a class="route-card high-school" href="high-school/">
            <span class="route-number">01</span>
            <div>
              <strong>高級中等學校（含高職）</strong>
              <small>十二年就學安置高級中等學校</small>
              <p>查看各障礙類組資格、時程、校科與預估名額。</p>
            </div>
            <span class="route-arrow" aria-hidden="true">→</span>
          </a>
          <a class="route-card service" href="service/">
            <span class="route-number">02</span>
            <div>
              <strong>集中式特教班服務群科</strong>
              <small>智能障礙學生安置簡章</small>
              <p>查看資格審核、能力評估、服務群科與報到時程。</p>
            </div>
            <span class="route-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </main>
    </section>

    <footer class="site-disclaimer portal-footer">
      <div class="site-disclaimer-inner">
        <p class="disclaimer-summary">菜菜老師整理，非臺北市政府教育局官方網站。實際資格、日期及名額以教育局最新公告為準。</p>
        <div class="footer-meta">
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSedYbNxe2KVboSqAsJAMQVWfAW9JIbT7RuJecVzdOnh9gkT2w/viewform" target="_blank" rel="noreferrer">聯絡菜菜老師・提供建議</a>
          <span aria-hidden="true">·</span>
          <span>最後核對 2026/8/2</span>
        </div>
      </div>
    </footer>

    <script>
      document.querySelector(".city-switcher-select").addEventListener("change", (event) => {
        location.href = event.target.value;
      });
      const legacyRoutes = new Set(["eligibility", "timeline", "schools", "schoolFinder", "faq", "consultation"]);
      const legacyRoute = location.hash.slice(1);
      if (legacyRoutes.has(legacyRoute)) location.replace(`high-school/#${legacyRoute}`);
    </script>
  </body>
</html>
